name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deploy target
        run: |
          if [ "${{ github.ref_name }}" = "master-deploy" ]; then
            echo "DEPLOY_TARGET=production" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_TARGET=gh-pages" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      - name: Add production CNAME
        if: github.ref_name == 'master-deploy'
        run: echo "beira.ar" > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
